# ============================================================
#  NPT 平衡（Langevin 活塞）（示例模型 cnt_crown，跑通版）
#  对应旧项目 crown/3eq/eq.conf，路径已改为七文件夹相对路径
#
#  用法（在 3eq/ 目录下执行，需先跑完 2min）：
#      namd3 +p32 +setcpuaffinity +devices 0 eq.conf > eq.log 2>&1
#
#  依赖文件：
#      ../2min/min.restart.coor/vel/xsc     上一次运行的续算文件
#      ../1model/system_ion.psf / system_ion.pdb
#      ../1model/cnt_restrain.pdb           约束用的 B 字段文件
#      ../forcefield/*                      力场参数
#
#  说明：盒子（cellBasisVector）不在这里写，而是从 min 的 .xsc 续算文件读取。
# ============================================================

structure          ../1model/system_ion.psf
coordinates        ../1model/system_ion.pdb

set temperature    300
set outputname     eq

# ---- 从 min 的结果继续 ----
set inputname      ../2min/min
if {[file exists $inputname.restart.coor] & [file exists $inputname.restart.vel] & [file exists $inputname.restart.xsc]} {
    binCoordinates $inputname.restart.coor
    binVelocities $inputname.restart.vel
    extendedSystem $inputname.restart.xsc
} else {
    binCoordinates $inputname.restart.coor.old
    binVelocities $inputname.restart.vel.old
    extendedSystem $inputname.restart.xsc.old
}

firsttimestep      0

# ---- 输入：力场参数 ----
paraTypeCharmm	    on
parameters          ../forcefield/par_all36_prot.prm
parameters          ../forcefield/par_all36_lipid.prm
parameters          ../forcefield/par_water_ions_na.prm
parameters          ../forcefield/par_all36_na.prm
parameters          ../forcefield/toppar_all36_dphpc.str
parameters          ../forcefield/C_O.par

# ---- 力场参数 ----
exclude             scaled1-4
oneFourScaling      1.0
cutoff              12.0
switching           on
switchdist          10.0
pairlistdist        14.0

# ---- 积分参数 ----
timestep            2.0
rigidBonds          all
nonbondedFreq       1
fullElectFrequency  2
stepspercycle       10

# ---- 恒温控制（此处用全局 Langevin，不用逐原子 B 文件）----
langevin            on
langevinDamping     5.0
langevinTemp        $temperature
langevinHydrogen    off

# ---- 周期性边界 ----
wrapWater           on
wrapAll             on

# ---- 输出控制 ----
binaryOutput        yes
binaryRestart       yes
# wrapNearest 设为 no：输出坐标统一折回原胞 [0, box]
wrapNearest         no
comMotion           yes

# ---- PME 静电 ----
PME                 yes
PMEGridSpacing      1.0

# ---- NPT：Langevin 活塞（xy 面积固定，只让 z 方向伸缩）----
useGroupPressure      yes
useFlexibleCell       yes
useConstantArea       yes
langevinPiston        on
langevinPistonTarget  1.01325
langevinPistonPeriod  1000.0
langevinPistonDecay   500.0
langevinPistonTemp    $temperature

# ---- 输出频率 ----
outputName          $outputname
restartfreq         1000
dcdfreq             1000
xstFreq             1000
outputEnergies      1000
outputPressure      1000

# ---- CNT 约束 ----
# cnt_restrain.pdb 里：CNT 碳 B=1（被约束），冠醚氧 B=0（自由运动）
constraints         on
consexp             2
consref             ../1model/cnt_restrain.pdb
conskfile           ../1model/cnt_restrain.pdb
constraintScaling   20
conskcol            B

# ---- 执行：2 fs/步 × 2000000 步 = 4 ns ----
run 2000000
