# ============================================================
#  能量最小化 + 短 MD（示例模型 cnt_crown，跑通版）
#  对应旧项目 crown/2min/min.conf，路径已改为七文件夹相对路径
#
#  用法（在 2min/ 目录下执行）：
#      namd3 +p32 +setcpuaffinity +devices 0 min.conf > min.log 2>&1
#      （+p32 +setcpuaffinity 是本机实测最优；NAMD 是 CUDA 版，必须有 GPU 节点）
#
#  依赖文件：
#      ../1model/system_ion.psf / system_ion.pdb   体系结构（23045 原子）
#      ../1model/cnt_langevin.pdb                  恒温用的 B 字段文件
#      ../1model/cnt_restrain.pdb                  约束用的 B 字段文件
#      ../forcefield/*                             力场参数
# ============================================================

structure          ../1model/system_ion.psf
coordinates        ../1model/system_ion.pdb

set temperature    300
set outputname     min

firsttimestep      0

# ---- 输入：力场参数 ----
paraTypeCharmm	    on
parameters          ../forcefield/par_all36_prot.prm
parameters          ../forcefield/par_all36_lipid.prm
parameters          ../forcefield/par_water_ions_na.prm
parameters          ../forcefield/par_all36_na.prm
parameters          ../forcefield/toppar_all36_dphpc.str
parameters          ../forcefield/C_O.par
temperature         $temperature

# ---- 力场参数 ----
exclude             scaled1-4
oneFourScaling      1.0
cutoff              12.0
switching           on
switchdist          10.0
pairlistdist        15.0

# ---- 积分参数 ----
timestep            1.0
rigidBonds          all
nonbondedFreq       1
fullElectFrequency  3
stepspercycle       12

# ---- 恒温控制：按 cnt_langevin.pdb 的 B 字段逐原子施加 ----
langevin            on
langevinTemp        $temperature
langevinFile        ../1model/cnt_langevin.pdb
langevinCol         B

# ---- 周期性边界 ----
# 盒子尺寸取自 system_ion.pdb 的 CRYST1。
# 注意：NAMD 的 cellOrigin 是「盒子中心」，不是角点。
# 这里取碳管中心 z = 39.911 作为盒子中心，盒子正好是 z ∈ [-10, 89.822]，
# 与水盒子完全重合，水和碳管都落在盒子内，输出不需要任何包裹即可对齐。
cellBasisVector1    51.152    0.0    0.0
cellBasisVector2    0.0    51.144    0.0
cellBasisVector3    0.0    0.0    99.822
cellOrigin          0.0    0.0    39.911
wrapWater           on
wrapAll             on

# ---- 输出控制 ----
binaryOutput        yes
binaryRestart       yes
# wrapNearest 设为 no：输出坐标统一折回原胞 [0, box]，
# 这样水和碳管不会错开半个盒子
wrapNearest         no
comMotion           yes

# ---- PME 静电 ----
PME                 yes
PMEGridSpacing      1.0

# ---- 输出频率 ----
outputName          $outputname
restartfreq         1200
dcdfreq             1200
xstFreq             1200
outputEnergies      1200
outputPressure      1200

# ---- CNT 约束 ----
# cnt_restrain.pdb 里：CNT 碳 B=1（被约束），冠醚氧 B=0（自由运动）
constraints         on
consexp             2
consref             ../1model/cnt_restrain.pdb
conskfile           ../1model/cnt_restrain.pdb
constraintScaling   20
conskcol            B

# ---- 执行：先最小化 9600 步，再给初速度跑 12000 步（1 fs/步 = 12 ps）----
minimize            9600
reinitvels          $temperature

run 12000
