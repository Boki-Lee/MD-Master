#############################################################
# US 伞形采样窗口模板 (NVT 平衡)
# 占位符 WINDOW_PDB_FILE / WINDOW_OUT_NAME / WINDOW_COLVARS_FILE
# 会被 setup_us.sh 替换成每个窗口的实际值
# 参考：/mnt/share/free energy-Ca/us/3template.conf
#############################################################

structure          ../1model/system_ion.psf
coordinates        WINDOW_PDB_FILE

set temperature    300
set outputname     WINDOW_OUT_NAME

# ---- 输入：力场参数 ----
paraTypeCharmm     on
parameters          ../forcefield/par_all36_prot.prm
parameters          ../forcefield/par_all36_lipid.prm
parameters          ../forcefield/par_water_ions_na.prm
parameters          ../forcefield/par_all36_na.prm
parameters          ../forcefield/toppar_all36_dphpc.str
parameters          ../forcefield/C_O.par

# ---- 输出 ----
outputName         $outputname
dcdfreq            500
xstFreq            500
outputEnergies     500

# ---- 周期边界 ----
source             ../1model/cell_params.tcl
cellBasisVector1   $cell_basis_1
cellBasisVector2   $cell_basis_2
cellBasisVector3   $cell_basis_3
cellOrigin         $cell_origin
wrapWater          on
wrapAll            on

# ---- 非键相互作用 ----
exclude            scaled1-4
oneFourScaling     1.0
cutoff             12.0
switching          on
switchdist         10.0
pairlistdist       14.0

# ---- PME ----
PME                yes
PMEGridSpacing     1.0

# ---- 积分（NAMD 3 不要写 stepsPerCycle）----
timestep           2.0
rigidBonds         all
nonbondedFreq      1
fullElectFrequency 2

# ---- 恒温 ----
temperature        $temperature
langevin           on
langevinTemp       $temperature
langevinFile       ../1model/cnt_langevin.pdb
langevinCol        B

# ---- 冻结 CNT ----
fixedAtoms         on
fixedAtomsFile     ../1model/cnt_fixed.pdb
fixedAtomsCol      B

# ---- 侧向约束：把目标离子钉在孔轴 (x=0,y=0)，只留 z 自由 ----
constraints        on
consexp            2
consref            ../1model/ion_restrain.pdb
conskfile          ../1model/ion_restrain.pdb
constraintScaling  20
conskcol           B
selectConstraints  on
selectConstrX      on
selectConstrY      on
selectConstrZ      off

# ---- Colvars（每个窗口各自固定的谐振子中心）----
colvars            on
colvarsConfig      WINDOW_COLVARS_FILE

# ---- 每个窗口 2.5M 步 = 5 ns（可改）----
run                2500000
