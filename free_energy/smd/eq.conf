#############################################################
# 平衡阶段（SMD 前处理）：minimize + 1 ns NVT
#
# 目的：VMD 溶剂化出来的水是格点摆放的、目标离子又是建模脚本手工挪到
#       (0,0,+ion_z_max) 的，只做 5000 步最小化就以几 Å/ns 往外拉，
#       SMD 起始那一段的水结构还没松弛。本阶段先把水在 300 K 下平衡 1 ns，
#       再把 eq_output.coor/.vel/.xsc 交给 smd.conf 拉伸。
#
# 为什么值得加（相对"把 minimize 写在 smd.conf 开头"的老做法）：
#   若 US 窗口范围压得较窄（例如孔心 ±5 Å），最外端窗口就落在 SMD 的起点附近，
#   而那个窗口往往又是 PMF 的零点参考 —— 起点没平衡会直接污染 PMF 基线。
#   代价很小：2 万原子体系 1 ns NVT 在 4090 上约 7 分钟（实测约 200 ns/day）。
#
# 与 smd.conf 的差别只有三处：
#   1) outputname = eq_output
#   2) 目标离子三个方向都约束住（selectConstrX/Y/Z 全 on），
#      保证平衡结束时离子仍精确位于原始放置点，SMD 起点才可控
#   3) 末尾是 minimize + reinitvels + run，不含 colvars
#
# 产物 eq_output.coor / .vel / .xsc 会被 smd.conf 用 bincoordinates /
# binvelocities / extendedSystem 接着用。
#
# 用法：由 run_smd.sh 自动调用（cd smd && ./run_smd.sh），一般不用手跑。
#############################################################

structure          ../1model/system_ion.psf
coordinates        ../1model/system_ion.pdb

set temperature    300
set outputname     eq_output

# ---- 输入：力场参数（与 smd.conf / US 窗口完全一致）----
paraTypeCharmm     on
parameters          ../forcefield/par_all36_prot.prm
parameters          ../forcefield/par_all36_lipid.prm
parameters          ../forcefield/par_water_ions_na.prm
parameters          ../forcefield/par_all36_na.prm
parameters          ../forcefield/toppar_all36_dphpc.str
parameters          ../forcefield/C_O.par

# ---- 输出 ----
# dcdfreq 5000：1 ns 只出 100 帧（约 27 MB），够肉眼检查水是否松弛
outputName         $outputname
dcdfreq            5000
xstFreq            500
outputEnergies     500

# ---- 周期边界（盒子由 build 产物提供）----
source             ../1model/cell_params.tcl
cellBasisVector1   $cell_basis_1
cellBasisVector2   $cell_basis_2
cellBasisVector3   $cell_basis_3
cellOrigin         $cell_origin
wrapWater          on
wrapAll            on

# ---- 非键相互作用（CHARMM 标准）----
exclude            scaled1-4
oneFourScaling     1.0
cutoff             12.0
switching          on
switchdist         10.0
pairlistdist       14.0

# ---- PME 长程静电 ----
PME                yes
PMEGridSpacing     1.0

# ---- 积分（NAMD 3 不要写 stepsPerCycle）----
timestep           2.0
rigidBonds         all
nonbondedFreq      1
fullElectFrequency 2

# ---- 恒温：按 cnt_langevin.pdb 的 B 列，只给水+离子施加（CNT 被冻结）----
temperature        $temperature
langevin           on
langevinTemp       $temperature
langevinFile       ../1model/cnt_langevin.pdb
langevinCol        B

# ---- 冻结 CNT（含冠醚氧，孔环刚性，反应坐标最干净）----
fixedAtoms         on
fixedAtomsFile     ../1model/cnt_fixed.pdb
fixedAtomsCol      B

# ---- 约束：平衡阶段把目标离子三维钉死在放置点 ----
# 与 smd.conf 的差别就在这里：smd 里 selectConstrZ 会关掉，只留 z 自由。
constraints        on
consexp            2
consref            ../1model/ion_restrain.pdb
conskfile          ../1model/ion_restrain.pdb
constraintScaling  20
conskcol           B
selectConstraints  on
selectConstrX      on
selectConstrY      on
selectConstrZ      on

# ---- 先最小化消除手工放置离子造成的重叠，再赋初速平衡 ----
minimize           5000
reinitvels         $temperature
run                500000
