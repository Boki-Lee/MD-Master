#############################################################
# SMD 拉伸动力学：目标离子从管外体相 (z=+12) 匀速拉到管内 (z=-6)
# 目的：生成离子穿过冠醚孔的连续轨迹，供后续提取 US 窗口构象
# 参考：外部伞形采样项目模板（原项目路径已省略）
#
# ⚠️ 本配置从平衡阶段 eq.conf 的产物续跑（eq_output.coor/.vel/.xsc），
#    不再自己做 minimize。run_smd.sh 会保证先跑 eq.conf 再跑本文件；
#    单独手跑本文件前请确认这三个文件存在。
#############################################################

structure          ../1model/system_ion.psf
coordinates        ../1model/system_ion.pdb

# ---- 从平衡阶段续跑（能量已最小化、水已平衡，不要再 minimize/reinitvels）----
bincoordinates     eq_output.coor
binvelocities      eq_output.vel
extendedSystem     eq_output.xsc

set temperature    300
set outputname     smd_output

# ---- 输入：力场参数（与现有 CNT 项目一致）----
paraTypeCharmm     on
parameters          ../forcefield/par_all36_prot.prm
parameters          ../forcefield/par_all36_lipid.prm
parameters          ../forcefield/par_water_ions_na.prm
parameters          ../forcefield/par_all36_na.prm
parameters          ../forcefield/toppar_all36_dphpc.str
parameters          ../forcefield/C_O.par

# ---- 输出 ----
outputName         $outputname
dcdfreq            500
xstFreq            500
outputEnergies     500

# ---- 周期边界（盒子由 build 产物提供）----
source             ../1model/cell_params.tcl
cellBasisVector1   $cell_basis_1
cellBasisVector2   $cell_basis_2
cellBasisVector3   $cell_basis_3
cellOrigin         $cell_origin
wrapWater          on
wrapAll            on

# ---- 非键相互作用（CHARMM 标准）----
exclude            scaled1-4
oneFourScaling     1.0
cutoff             12.0
switching          on
switchdist         10.0
pairlistdist       14.0

# ---- PME 长程静电 ----
PME                yes
PMEGridSpacing     1.0

# ---- 积分（注意：NAMD 3 不要写 stepsPerCycle，GPU-resident 会自动管原子迁移）----
timestep           2.0
rigidBonds         all
nonbondedFreq      1
fullElectFrequency 2

# ---- 恒温：按 cnt_langevin.pdb 的 B 列，只给水+离子施加（CNT 被冻结）----
# ⚠️ 这里【不能】写 `temperature`：本配置用 binvelocities 从平衡阶段续跑，
#    NAMD 会报 "Cannot specify both an initial temperature and a velocity file"。
#    恒温靠下面的 langevin + langevinTemp，与 temperature 无关。
langevin           on
langevinTemp       $temperature
langevinFile       ../1model/cnt_langevin.pdb
langevinCol        B

# ---- 冻结 CNT（含冠醚氧，孔环刚性，反应坐标最干净）----
fixedAtoms         on
fixedAtomsFile     ../1model/cnt_fixed.pdb
fixedAtomsCol      B

# ---- 侧向约束：把目标离子钉在孔轴 (x=0, y=0)，只留 z 自由（对应参考里的 selectConstrX/Y）----
constraints        on
consexp            2
consref            ../1model/ion_restrain.pdb
conskfile          ../1model/ion_restrain.pdb
constraintScaling  20
conskcol           B
selectConstraints  on
selectConstrX      on
selectConstrY      on
selectConstrZ      off

# ---- Colvars（SMD 拉动）----
colvars            on
colvarsConfig      smd.colvars

# ---- 直接跑 SMD（最小化与平衡已由 eq.conf 做完，不要再 minimize）----
run                1000000
